name: CI

# A pull request is built by its pull_request run, so push builds only master and the version tags.
on:
  push:
    branches: [master]
    tags: ['v*.*.*']
    paths-ignore:
      - '**/*.md'
  pull_request:
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the image to ghcr.io, tagged sha-<commit> and with the branch's name
        type: boolean
        default: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/conectionist/romanian_whist_server

# A new push to a PR cancels that PR's older run. Runs on master are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Ubuntu 24.04's own g++ 13.3 and CMake 3.28, the owner's machine's, with warnings as errors. The
  # runner's image brings a newer CMake, so the job runs in a container.
  build:
    name: Build (Linux)
    runs-on: ubuntu-latest
    container: ubuntu:24.04

    steps:
      # git comes before the checkout, so that the checkout brings the submodules.
      - name: Install the build's packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential cmake git ca-certificates \
              libjsoncpp-dev uuid-dev zlib1g-dev libssl-dev

      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Configure
        run: cmake --preset release -DWHIST_SERVER_WARNINGS_AS_ERRORS=ON

      # --parallel needs a number: a bare one gives make an unlimited -j.
      - name: Build
        run: cmake --build --preset release --parallel 4

      # --no-tests=error, so that a build with its tests switched off cannot pass.
      - name: Test the server
        run: ctest --preset release --output-on-failure --no-tests=error

  # The image's toolchain (g++ 15, CMake 4.2) is newer than the first job's (g++ 13, CMake 3.28), so
  # the server is built and tested on it too. Warnings are not errors here: a newer compiler may
  # warn about code g++ 13 accepts.
  build-ubuntu-26:
    name: Build (Ubuntu 26.04, as the image)
    runs-on: ubuntu-latest
    container: ubuntu:26.04

    steps:
      # git comes before the checkout, so that the checkout brings the submodules.
      - name: Install the build's packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential cmake git ca-certificates \
              libjsoncpp-dev uuid-dev zlib1g-dev libssl-dev

      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Configure
        run: cmake --preset release

      - name: Build
        run: cmake --build --preset release --parallel 4

      - name: Test the server
        run: ctest --preset release --output-on-failure --no-tests=error

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.info.outputs.commit }}
      tags: ${{ steps.meta.outputs.tags }}
      labels: ${{ steps.meta.outputs.labels }}

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Find the commit and the protocol version
        id: info
        run: |
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          protocol=$(sed -n 's/.*protocolVersion = \([0-9][0-9]*\);.*/\1/p' server/core/Protocol.h)
          test -n "$protocol"
          echo "protocol=$protocol" >> "$GITHUB_OUTPUT"

      - name: A tag must be the version in CMakeLists.txt
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^ *VERSION \([0-9][0-9.]*\)$/\1/p' CMakeLists.txt | head -n 1)
          test -n "$version"
          test "$TAG" = "v$version"

      - uses: docker/setup-buildx-action@v4

      # latest and the version tags come from a push only: a manual run on master or on a tag would
      # otherwise move them.
      - name: Name the image's tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
            type=semver,pattern={{version}},enable=${{ github.event_name == 'push' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ github.event_name == 'push' }}
            type=ref,event=branch,enable=${{ github.event_name == 'workflow_dispatch' }}
            type=sha
          labels: |
            org.opencontainers.image.title=Romanian Whist server
            org.opencontainers.image.licenses=AGPL-3.0-or-later
            io.github.conectionist.whist.protocol=${{ steps.info.outputs.protocol }}

      # A fixed job count keeps the runner from running out of memory.
      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:ci
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            JOBS=4
            WHIST_COMMIT=${{ steps.info.outputs.commit }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,scope=server,mode=max

      - uses: actions/setup-node@v7
        with:
          node-version: 26

      # The arithmetic of the load test and its scripted people, which need no server.
      - name: Test the load test's own code
        run: node --test tools/load/load.test.mjs

      # The hardening flags are the ones the compose files set. The image's configuration is mounted
      # with a drain of 5 s and a grace period of 1 s, so that the checks of a drain are quick.
      - name: Run the image, play against it, and stop it when nobody is at its games
        env:
          COMMIT: ${{ steps.info.outputs.commit }}
        run: |
          node -e 'const c = require("./deploy/docker-config.json"); c.drain_ms = 5000; c.grace_period_ms = 1000; console.log(JSON.stringify(c, null, 2))' \
              > "$RUNNER_TEMP/config.json"
          docker run -d --name whist --read-only --tmpfs /tmp --cap-drop ALL \
              --security-opt no-new-privileges -v "$RUNNER_TEMP/config.json:/etc/whist/config.json:ro" \
              -p 127.0.0.1:8080:8080 "$IMAGE:ci"
          timeout 60 sh -c 'until [ "$(docker inspect -f "{{.State.Health.Status}}" whist)" = healthy ]; do sleep 1; done'

          # The image's health check, run by hand, and the route it asks.
          test "$(docker exec whist /usr/local/bin/whist_server --health-check --config /etc/whist/config.json)" = ok
          test "$(curl -fsS http://127.0.0.1:8080/health)" = '{"status":"ok"}'

          node tools/smoke/smoke.mjs --url http://127.0.0.1:8080 --commit "$COMMIT"

          # A tiny load run, to see that the load test still plays against the image.
          node tools/load/load.mjs --url http://127.0.0.1:8080 --kind solo --steps 2 --hold 3 --settle 1

          # Their players are gone, and the games are parked on them. Once the grace period of 1 s has
          # passed nobody is at them, so a stop does not wait: the server drains at once, long before
          # its 5 s, and exits with 0.
          sleep 3
          docker kill --signal SIGTERM whist
          timeout 15 docker wait whist
          test "$(docker inspect -f '{{.State.ExitCode}}' whist)" = 0
          docker logs whist > "$RUNNER_TEMP/whist.log" 2>&1
          grep -q "drained: no attended game is running" "$RUNNER_TEMP/whist.log"
          test "$(grep -c "drain time is up" "$RUNNER_TEMP/whist.log" || true)" = 0

      # A game that someone is at is waited for. A load run holds one, connected, and the drain goes on
      # until its 5 s are up: /health answers 503 and the health check still passes meanwhile.
      - name: Stop the image with a game that someone is at
        run: |
          docker rm whist
          docker run -d --name whist-drain --read-only --tmpfs /tmp --cap-drop ALL \
              --security-opt no-new-privileges -v "$RUNNER_TEMP/config.json:/etc/whist/config.json:ro" \
              -p 127.0.0.1:8080:8080 "$IMAGE:ci"
          timeout 60 sh -c 'until [ "$(docker inspect -f "{{.State.Health.Status}}" whist-drain)" = healthy ]; do sleep 1; done'

          node tools/load/load.mjs --url http://127.0.0.1:8080 --kind solo --steps 1 --hold 120 --settle 1 \
              > "$RUNNER_TEMP/load.log" 2>&1 &
          load=$!
          sleep 6

          docker kill --signal SIGTERM whist-drain
          timeout 10 sh -c 'until [ "$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8080/health)" = 503 ]; do sleep 0.2; done'
          test "$(docker exec whist-drain /usr/local/bin/whist_server --health-check --config /etc/whist/config.json)" = draining
          timeout 30 docker wait whist-drain
          kill "$load" || true
          test "$(docker inspect -f '{{.State.ExitCode}}' whist-drain)" = 0
          docker logs whist-drain > "$RUNNER_TEMP/whist-drain.log" 2>&1
          grep -q "1 attended" "$RUNNER_TEMP/whist-drain.log"
          grep -q "drain time is up" "$RUNNER_TEMP/whist-drain.log"

      # A server that is stopped drains for drain_ms, and Docker kills it when the grace period is up.
      - name: Check the compose files
        run: |
          WHIST_DOMAIN=:80 docker compose -f deploy/docker-compose.yml config -q
          docker compose -f deploy/docker-compose.own-proxy.yml config -q
          docker compose config -q
          test "$(WHIST_DOMAIN=:80 docker compose -f deploy/docker-compose.yml config --format json | jq -r .services.server.stop_grace_period)" = 16m0s
          test "$(docker compose -f deploy/docker-compose.own-proxy.yml config --format json | jq -r .services.server.stop_grace_period)" = 16m0s
          node -e 'const d = require("./deploy/docker-config.json").drain_ms; if (!(d < 16 * 60 * 1000)) { console.error(`drain_ms ${d} is not under the 16 minute stop_grace_period`); process.exit(1); }'

      # The sum of the layers: the size docker image inspect gives depends on the runner's image store.
      - name: Check the image's size against its budget
        run: |
          bytes=$(docker history --human=false --format '{{.Size}}' "$IMAGE:ci" | awk '{ sum += $1 } END { print sum }')
          echo "The image is $((bytes / 1000000)) MB, of a budget of 150 MB." | tee -a "$GITHUB_STEP_SUMMARY"
          test "$bytes" -le 150000000

      - name: The server's log
        if: failure()
        run: |
          docker logs whist || true
          docker logs whist-drain || true

  # Only master, a version tag, or a manual run that asks for it. A pull request never publishes.
  publish:
    name: Publish the image
    needs: [build, build-ubuntu-26, docker]
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ needs.docker.outputs.tags }}
          labels: ${{ needs.docker.outputs.labels }}
          build-args: |
            JOBS=4
            WHIST_COMMIT=${{ needs.docker.outputs.commit }}
          cache-from: type=gha,scope=server
