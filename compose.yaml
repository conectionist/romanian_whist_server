# The server built from this checkout: docker compose up --build, then http://127.0.0.1:8080
services:
  server:
    build:
      context: .
      args:
        JOBS: ${WHIST_JOBS:-2}
        WHIST_COMMIT: ${WHIST_COMMIT:-}
    ports: ["127.0.0.1:8080:8080"]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    # It must outlast the server's drain_ms (15 minutes): after SIGTERM the server lets the games
    # that someone is at end for up to that long, and Docker kills it when this runs out.
    stop_grace_period: 16m
