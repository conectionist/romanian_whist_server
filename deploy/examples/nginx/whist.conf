# Romanian Whist behind nginx: include this inside the server block for its host.
# Everything goes to the server, /health and /version included. The server sends the page's
# security headers and its caching rules itself, so none are added here. X-Forwarded-For has to be
# sent: it is how the server tells its clients apart.

location / {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# The game's WebSocket. The server pings every 10 s, so nginx's 60 s read timeout holds.
location = /ws {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
