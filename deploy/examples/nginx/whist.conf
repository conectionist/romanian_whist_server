# Romanian Whist behind nginx: include this inside the server block for its host.
# The headers are in an include of their own: a location's add_header drops the ones it inherits.
# Cache-Control has no "always", so that only successful answers are cached.

location / {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    include snippets/whist-headers.conf;
    add_header Cache-Control "public, max-age=3600";
}

location /assets/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    include snippets/whist-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

# The page itself, and a table's link, which the server answers with the page.
location ~ ^/(index\.html)?$ {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    include snippets/whist-headers.conf;
    add_header Cache-Control no-cache;
}

location /t/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    include snippets/whist-headers.conf;
    add_header Cache-Control no-cache;
}

# The game's WebSocket. The server pings every 10 s, so nginx's 60 s read timeout holds.
location = /ws {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
